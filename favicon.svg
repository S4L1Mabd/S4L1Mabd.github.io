<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background with rounded corners -->
  <rect width="32" height="32" rx="5" fill="#0d1117"/>
  <!-- Teal border -->
  <rect width="32" height="32" rx="5" fill="none" stroke="#00D9A6" stroke-width="1.5" opacity="0.7"/>
  <!-- Corner accents top-left -->
  <line x1="2" y1="7" x2="2" y2="2" stroke="#00D9A6" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="2" y1="2" x2="7" y2="2" stroke="#00D9A6" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Corner accents bottom-right -->
  <line x1="30" y1="25" x2="30" y2="30" stroke="#00D9A6" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="30" y1="30" x2="25" y2="30" stroke="#00D9A6" stroke-width="1.5" stroke-linecap="round"/>
  <!-- SA text -->
  <text x="16" y="22" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-weight="700"
        font-size="15"
        fill="#00D9A6"
        letter-spacing="-0.5">SA</text>
</svg>
